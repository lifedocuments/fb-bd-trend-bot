name: Post a BD trend to Facebook

on:
  schedule:
    # Three posts a day at Bangladesh peak times (UTC+6):
    #   09:00 BD = 03:00 UTC (morning commute / office start)
    #   14:00 BD = 08:00 UTC (lunch break)
    #   21:00 BD = 15:00 UTC (evening, the busiest Facebook time)
    # Cron is always UTC on GitHub Actions, and GitHub may start scheduled
    # runs a little late at busy times.
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no AI/Unsplash/Facebook calls, just fetch+filter trends)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fb-bd-trend-bot-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Photocards are drawn with Python + Pillow (its wheel bundles the Bangla
      # text-shaping engine). If any of this fails, posting still works: the
      # bot just uses the plain photo instead of a card.
      - uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.12'

      - name: Install photocard tools
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq libfribidi0 >/dev/null 2>&1 || true
          python3 -m pip install --quiet pillow==12.1.1 || python3 -m pip install --quiet --break-system-packages pillow==12.1.1

      - name: Run posting script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PAGE_NAME: ${{ vars.PAGE_NAME }}
          TARGET_AUDIENCE: ${{ vars.TARGET_AUDIENCE }}
          BRAND_HASHTAG: ${{ vars.BRAND_HASHTAG }}
          EVERGREEN_FALLBACK: ${{ vars.EVERGREEN_FALLBACK }}
          PHOTOCARDS: ${{ vars.PHOTOCARDS }}
          NEWS_LINK_COMMENT: ${{ vars.NEWS_LINK_COMMENT }}
          SPECIAL_DAYS: ${{ vars.SPECIAL_DAYS }}
          POST_LANGUAGE: ${{ vars.POST_LANGUAGE }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          ALLOW_TREND_PICTURES: ${{ vars.ALLOW_TREND_PICTURES }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/post-trend.js

      - name: Commit updated posted-trends log
        run: |
          git config user.name "fb-bd-trend-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/posted.json; then
            git add data/posted.json
            git commit -m "Log posted trend [skip ci]"
            git push
          else
            echo "No change to data/posted.json (nothing posted, or dry run)."
          fi
