name: Roof Oxygen Factory post

on:
  schedule:
    - cron: '30 2 * * *'    # 08:30 Bangladesh time — morning series
    - cron: '30 7 * * *'    # 13:30 — new idea
    - cron: '30 13 * * *'   # 19:30 — older topic, fresh format
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which post (auto = follow the clock; extra = one more fresh post now, max 3 extra a day)'
        type: choice
        options: [auto, extra, morning, noon, evening]
        default: auto
      dry_run:
        description: 'Dry run (write and design the post, do not publish)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roof-oxygen-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get install -y -qq libraqm0 >/dev/null 2>&1 || true
          pip install --quiet requests openpyxl pillow
      - name: Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_SHARED_SECRET: ${{ secrets.MAKE_SHARED_SECRET }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_EXTRA_PER_DAY: ${{ vars.MAX_EXTRA_PER_DAY }}
          SLOT: ${{ github.event.inputs.slot != 'auto' && github.event.inputs.slot || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python bot/post.py
      - name: Save posting log
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "roof-oxygen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || (git commit -m "Posting log [skip ci]" && git pull --rebase && git push)
